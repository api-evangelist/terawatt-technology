aid: terawatt-technology
name: TeraWatt Technology
description: >-
  TeraWatt Technology Inc. is a next-generation lithium-ion battery company founded in 2020 by
  Ken Ogata (CEO) and Yifan Tang, headquartered in California with an R&D center in Santa Clara
  and operations in Japan, including its first mass-production facility in Shizuoka. The company
  develops, manufactures and commercializes lithium-ion cells engineered for ultra-high energy
  density, high power output, improved safety and competitive cost, aimed at electric vehicles,
  drones, eVTOL aircraft and grid-scale energy-storage systems. It closed a Series C round with
  investors including Khosla Ventures, Temasek, JIC Venture Growth Investments, JBIC, JERA and
  ITOCHU Technology Ventures. TeraWatt Technology is a hardware manufacturer: it publishes no
  public API, developer portal, machine-readable contract or SDK, which was verified by probing
  its only public host rather than assumed.
